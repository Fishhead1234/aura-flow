<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#141210" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A25A44" />
      <stop offset="40%" stop-color="#C4704F" />
      <stop offset="100%" stop-color="#E0A96D" />
    </linearGradient>
    <linearGradient id="leafAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F4EE" />
      <stop offset="100%" stop-color="#E5DEC9" />
    </linearGradient>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C4704F" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#E0A96D" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed background for maskable compatibility -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Ambient glowing aura disk -->
  <circle cx="256" cy="245" r="195" fill="url(#auraGlow)" />

  <!-- Outer Zen Minimalist Ring -->
  <circle cx="256" cy="245" r="148" fill="none" stroke="#C4704F" stroke-width="2.5" stroke-dasharray="4 6" opacity="0.45" />

  <!-- Botanical Leaf Sprig Emblem -->
  <g transform="translate(256, 240) scale(1.45)">
    <!-- Central Organic Curved Stem -->
    <path d="M -22 68 C -8 38, 4 2, 2 -58" fill="none" stroke="url(#leafGrad)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Terminal Crown Leaf -->
    <path d="M 2 -58 C 14 -72, 2 -92, -4 -94 C -10 -92, -18 -72, 2 -58 Z" fill="url(#leafGrad)" />
    <!-- Leaf midrib -->
    <path d="M 2 -58 C -1 -72, -3 -86, -4 -94" fill="none" stroke="#F7F4EE" stroke-width="1.2" opacity="0.6" stroke-linecap="round" />

    <!-- Upper Right Leaf -->
    <path d="M 2 -32 C 22 -44, 46 -38, 52 -28 C 48 -14, 26 -14, 2 -32 Z" fill="url(#leafGrad)" />
    <path d="M 2 -32 C 24 -34, 42 -30, 52 -28" fill="none" stroke="#F7F4EE" stroke-width="1.2" opacity="0.5" stroke-linecap="round" />

    <!-- Upper Left Leaf -->
    <path d="M -2 -14 C -22 -26, -46 -20, -52 -10 C -48 4, -26 4, -2 -14 Z" fill="url(#leafGrad)" />
    <path d="M -2 -14 C -24 -16, -42 -12, -52 -10" fill="none" stroke="#F7F4EE" stroke-width="1.2" opacity="0.5" stroke-linecap="round" />

    <!-- Middle Right Leaf -->
    <path d="M -6 10 C 16 -2, 40 4, 46 14 C 42 28, 20 28, -6 10 Z" fill="url(#leafGrad)" />
    <path d="M -6 10 C 16 8, 36 12, 46 14" fill="none" stroke="#F7F4EE" stroke-width="1.2" opacity="0.5" stroke-linecap="round" />

    <!-- Lower Left Leaf -->
    <path d="M -12 34 C -32 22, -56 28, -62 38 C -58 52, -36 52, -12 34 Z" fill="url(#leafGrad)" />
    <path d="M -12 34 C -34 32, -52 36, -62 38" fill="none" stroke="#F7F4EE" stroke-width="1.2" opacity="0.5" stroke-linecap="round" />

    <!-- Base Sprout Petal -->
    <circle cx="-22" cy="68" r="3.5" fill="#E0A96D" opacity="0.9" />
  </g>

  <!-- Typography Brand Subtext -->
  <text x="256" y="425" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Playfair Display', serif" font-size="26" font-weight="600" letter-spacing="8" fill="#EFECE6" text-anchor="middle" opacity="0.95">AURA FLOW</text>
  <text x="256" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="500" letter-spacing="4" fill="#C4704F" text-anchor="middle" opacity="0.85">STUDIO</text>
</svg>
