<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#141210" />
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0A96D" />
      <stop offset="50%" stop-color="#C4704F" />
      <stop offset="100%" stop-color="#8E462E" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4704F" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#E0A96D" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#F5E6D3" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0A96D" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#C4704F" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed background for maskable compatibility -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Ambient glowing aura disk -->
  <circle cx="256" cy="256" r="190" fill="url(#sunGlow)" />

  <!-- Concentric Zen Halo Ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#terracottaGrad)" stroke-width="3" stroke-dasharray="6 8" opacity="0.6" />
  <circle cx="256" cy="256" r="132" fill="none" stroke="#E0A96D" stroke-width="1.5" opacity="0.4" />

  <!-- Central Aura Flow Icon: Rising Sun & Mindful Wave / Lotus Form -->
  <g transform="translate(256, 256)">
    <!-- Ascending Sun Disc -->
    <circle cx="0" cy="-32" r="38" fill="url(#terracottaGrad)" />
    <circle cx="0" cy="-32" r="28" fill="#F7F4EE" opacity="0.15" />

    <!-- Mindful Flow Petals / Cradle Waves -->
    <!-- Left flow arc -->
    <path d="M -80 48 C -64 0, -20 -20, 0 10 C -30 20, -50 40, -80 48 Z" fill="url(#goldGlow)" />
    <!-- Right flow arc -->
    <path d="M 80 48 C 64 0, 20 -20, 0 10 C 30 20, 50 40, 80 48 Z" fill="url(#goldGlow)" />
    
    <!-- Base Lotus Basin (Harmonic Wave) -->
    <path d="M -90 44 C -45 92, 45 92, 90 44 C 55 76, -55 76, -90 44 Z" fill="url(#terracottaGrad)" />

    <!-- Center Radiant Seed Dot -->
    <circle cx="0" cy="28" r="7" fill="#F7F4EE" />
  </g>

  <!-- Elegant Brand Typography Sub-badge -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Playfair Display', serif" font-size="28" font-weight="600" letter-spacing="8" fill="#EFECE6" text-anchor="middle" opacity="0.95">AURA FLOW</text>
  <text x="256" y="444" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="500" letter-spacing="4" fill="#E0A96D" text-anchor="middle" opacity="0.75">STUDIO</text>
</svg>
